name: Build NX Browser

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        id: build_debug
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-debug.log

      - name: Build release APK
        id: build_release
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build-release.log

      - name: Report APK sizes
        if: success()
        run: |
          echo "### NX Browser APK" >> $GITHUB_STEP_SUMMARY
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            size=$(du -h "$f" | cut -f1)
            echo "- $f ($size)" >> $GITHUB_STEP_SUMMARY
          done

      - name: Collect error log
        if: failure()
        run: |
          {
            echo "NX Browser build failed"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "===== debug build log ====="
            cat build-debug.log 2>/dev/null || echo "no debug log"
            echo ""
            echo "===== release build log ====="
            cat build-release.log 2>/dev/null || echo "no release log"
          } > error.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error
          path: error.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nxbrowser-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nxbrowser-release
          path: app/build/outputs/apk/release/*.apk
